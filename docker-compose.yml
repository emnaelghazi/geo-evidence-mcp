# Core stack. M2 adds the `mcp` service; Langfuse lives in docker-compose.langfuse.yml.
name: geo-evidence-mcp

services:
  db:
    build:
      context: ./docker/postgis-pgvector
    image: geo-evidence-mcp/postgis-pgvector:16-3.4-0.7.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run `make init` to create .env}
      POSTGRES_DB: ${POSTGRES_DB:-gem}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - gem_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gem_pgdata:
